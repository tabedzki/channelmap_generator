services:
  pixelmap:
    # Pinned, not `latest`. Every tag build also pushes `latest`, so with
    # `latest` + `pull_policy: always` a redeploy silently jumps to whatever
    # was built most recently -- including a release you are trying to roll
    # back *from*. Override for a one-off with `PIXELMAP_TAG=v1.2.3 docker
    # compose up -d`.
    image: ghcr.io/m-beau/pixelmap:latest
    container_name: pixelmap
    pull_policy: always
    ports:
      - "5008:5008"
    environment:
      - INTERNAL_PORT=5008 #This number should reflect the port after the `:` above
      - ANALYTICS_DB_PATH=/app/output/visitor_analytics.sqlite3
      - ANALYTICS_TRUST_PROXY_HEADERS=false
      - ANALYTICS_COOKIE_NAME=pixelmap_visitor_id
      - ANALYTICS_COOKIE_MAX_AGE_DAYS=365
      - ANALYTICS_COOKIE_SAMESITE=Lax
      - ANALYTICS_COOKIE_SECURE=false
    volumes:
      - ./output:/app/output
      - brainglobe_cache:/root/.brainglobe
    healthcheck:
      # CMD-SHELL with `$$` so the port is read from the *container's*
      # environment. Plain `${INTERNAL_PORT}` is interpolated by Compose from
      # the host shell instead, which silently becomes `http://localhost:/`
      # -- a healthcheck that can never pass -- when the host doesn't happen
      # to export INTERNAL_PORT.
      #
      # /liveness (see entrypoint.sh's --liveness flag), not /app: hitting
      # /app builds a full Bokeh session per probe (+27 MB RSS, torn down
      # ~60s later) -- in production that was a session build/destroy cycle
      # roughly every 31s with zero real users.
      test: ["CMD-SHELL", "curl --fail http://localhost:$${INTERNAL_PORT:-5008}/liveness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    # Cap container memory so the *container* gets OOM-killed and restarted
    # by Docker's restart policy, not the host. Size as roughly:
    # ~300 MB base + 2 x the largest atlas you allow users to compute with
    # (decoding holds every decompressed chunk *and* the assembled array at
    # once: whs_sd_rat_39um is a 1.07 GB array and peaks at +2.1 GB) + ~6 MB
    # per open browser tab.
    #
    # The app keeps decoded atlases in a cache budgeted at half this limit
    # (read from the cgroup), so a larger limit also means fewer re-decodes
    # when users switch atlases. PIXELMAP_ATLAS_CACHE_MB overrides the budget.
    # deploy:
    #   resources:
    #     limits:
    #       memory: 3g

volumes:
  # Persists brainglobe atlas downloads across container restarts.
  # The default atlases (allen_mouse_25um, whs_sd_rat_39um) are pre-baked into
  # the image and re-seeded into this volume on every start by entrypoint.sh,
  # so an old or empty volume can no longer mask them. Any additional atlases
  # users download on the server accumulate here.
  brainglobe_cache:
